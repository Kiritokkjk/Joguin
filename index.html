<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo do Dinossauro</title>
</head>
<body style="margin: 0; padding: 20px; background: #f5f5f5; display: flex; flex-direction: column; align-items: center; font-family: Arial;">
    <h1>🦕 Jogo do Dinossauro</h1>
    <canvas id="gameCanvas" width="800" height="400" style="display: block; background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%); border: 2px solid #ccc; border-radius: 8px; cursor: pointer; touch-action: manipulation; margin: 20px 0;"></canvas>
    <p style="text-align: center; color: #666;">
        Pressione <strong>ESPAÇO</strong>, <strong>SETA PARA CIMA</strong> ou <strong>CLIQUE</strong> para pular
    </p>

    <script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameRunning = false;
let gameOver = false;
let score = 0;
let speed = 6;

const dino = {
  x: 50,
  y: 300,
  width: 40,
  height: 40,
  velocityY: 0,
  jumpPower: -15,
  gravity: 0.6,
  grounded: true,
  color: '#90EE90'
};

const obstacles = [];
let obstacleTimer = 0;
const groundY = 340;

function startGame() {
  gameRunning = true;
  gameOver = false;
  score = 0;
  speed = 6;
  obstacles.length = 0;
  dino.y = groundY;
  dino.velocityY = 0;
  dino.grounded = true;
}

function createObstacle() {
  obstacles.push({
    x: canvas.width,
    y: groundY,
    width: 25,
    height: 40,
    color: '#FF6347'
  });
}

function updateGame() {
  if (!gameRunning) return;

  dino.velocityY += dino.gravity;
  dino.y += dino.velocityY;

  if (dino.y >= groundY) {
    dino.y = groundY;
    dino.velocityY = 0;
    dino.grounded = true;
  }

  obstacleTimer++;
  if (obstacleTimer > Math.max(60 - speed * 2, 30)) {
    createObstacle();
    obstacleTimer = 0;
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    obstacles[i].x -= speed;

    if (obstacles[i].x + obstacles[i].width < 0) {
      obstacles.splice(i, 1);
      score += 10;
      if (score % 100 === 0 && speed < 12) {
        speed += 1;
      }
      continue;
    }

    if (checkCollision(dino, obstacles[i])) {
      gameRunning = false;
      gameOver = true;
    }
  }
}

function checkCollision(rect1, rect2) {
  return (
    rect1.x < rect2.x + rect2.width &&
    rect1.x + rect1.width > rect2.x &&
    rect1.y < rect2.y + rect2.height &&
    rect1.y + rect1.height > rect2.y
  );
}

function drawGame() {
  ctx.fillStyle = '#E0F6FF';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#8B7355';
  ctx.fillRect(0, groundY + 40, canvas.width, 20);

  ctx.fillStyle = dino.color;
  ctx.fillRect(dino.x, dino.y, dino.width, dino.height);

  ctx.fillStyle = '#000';
  ctx.arc(dino.x + 30, dino.y + 10, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#FF6347';
  obstacles.forEach(obs => {
    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
  });

  ctx.fillStyle = '#000';
  ctx.font = 'bold 24px Arial';
  ctx.fillText(`Pontos: ${score}`, 20, 40);
  ctx.font = '14px Arial';
  ctx.fillText(`Velocidade: ${speed}`, 20, 65);

  if (gameOver) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 48px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 40);

    ctx.font = '24px Arial';
    ctx.fillText(`Pontuação Final: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
    ctx.fillText('Clique para jogar novamente', canvas.width / 2, canvas.height / 2 + 60);
    ctx.textAlign = 'left';
  }

  if (!gameRunning && !gameOver) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 48px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('PRONTO?', canvas.width / 2, canvas.height / 2 - 40);
    ctx.font = '20px Arial';
    ctx.fillText('Clique para começar', canvas.width / 2, canvas.height / 2 + 30);
    ctx.textAlign = 'left';
  }
}

function gameLoop() {
  updateGame();
  drawGame();
  requestAnimationFrame(gameLoop);
}

function jump() {
  if (dino.grounded && gameRunning) {
    dino.velocityY = dino.jumpPower;
    dino.grounded = false;
  }
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (!gameRunning && !gameOver) {
      startGame();
    } else if (gameRunning) {
      jump();
    }
  }
  if (gameOver && (e.code === 'Space' || e.code === 'ArrowUp')) {
    gameOver = false;
    startGame();
  }
});

canvas.addEventListener('click', () => {
  if (!gameRunning && !gameOver) {
    startGame();
  } else if (gameRunning) {
    jump();
  } else if (gameOver) {
    gameOver = false;
    startGame();
  }
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (!gameRunning && !gameOver) {
    startGame();
  } else if (gameRunning) {
    jump();
  } else if (gameOver) {
    gameOver = false;
    startGame();
  }
});

startGame();
gameLoop();
    </script>
</body>
  </html>
